upstream avov_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    client_body_timeout 60s;
    send_timeout 60s;

    include /etc/nginx/snippets/security-headers.conf;

    # Health check directo (orquestadores / balanceadores)
    location = /api/v1/health/live {
        proxy_pass http://avov_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://avov_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # OpenAPI deshabilitado en producción (APP_DEBUG=false)
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    location / {
        return 404 "AVOV API — use /api/v1/";
    }
}
