services:
  mysql:
    image: mysql:8.4
    container_name: avov-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-avov_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avov_db}
      MYSQL_USER: ${MYSQL_USER:-avov_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-avov_user_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-avov_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - avov-network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: avov-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-avov_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-avov_user_secret}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - avov-network

  redis:
    image: redis:7.4-alpine
    container_name: avov-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - avov-network

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: avov-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config:/qdrant/config:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - avov-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avov-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-avov_user}:${MYSQL_PASSWORD:-avov_user_secret}@mysql:3306/${MYSQL_DATABASE:-avov_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - avov-network

volumes:
  mysql_data:
  redis_data:
  qdrant_data:

networks:
  avov-network:
    driver: bridge
