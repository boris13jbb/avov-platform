# CI de producto AVOV: pytest (avov_test) + flutter analyze/test.
# Complementa el gate estático e2e-tooling-static; no lo sustituye.
name: product-ci

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-pytest:
    name: backend-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: avov_test
          MYSQL_USER: avov_user
          MYSQL_PASSWORD: avov_user_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      qdrant:
        # Sin health-cmd: la imagen oficial no garantiza curl/bash en PATH.
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
    env:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: ci-app-secret-key-min-32-chars-long!!
      JWT_SECRET_KEY: ci-jwt-secret-key-min-32-chars-long!!
      DATABASE_URL: mysql+pymysql://avov_user:avov_user_secret@127.0.0.1:3306/avov_test
      REDIS_URL: redis://127.0.0.1:6379/1
      # Clave distinta del marcador de .env.example; no es un secreto real.
      # Vacía o el marcador hacen fallar tests que construyen Settings con otra clave
      # porque pydantic-settings prioriza variables de entorno del job.
      DEEPSEEK_API_KEY: ci-deepseek-key-not-for-production
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: "6333"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply Alembic migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q --tb=short

  frontend-flutter:
    name: frontend-flutter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        run: flutter analyze
      - name: Flutter test
        working-directory: frontend
        run: flutter test
