# Plantilla Cloud Build — NO ejecutar sin autorización (genera costes: build + Artifact Registry).
# Sustituir PROJECT_ID, REGION y REPO antes del primer uso.
#
# gcloud builds submit --config=deploy/gcp/cloudbuild.yaml \
#   --project=PROJECT_ID backend

substitutions:
  _REGION: southamerica-east1
  _REPO: avov
  _SERVICE: avov-api
  _IMAGE: avov-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .
    dir: backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
