# AVOV - Override Nginx Flutter Web + TLS (Fase 42)
# Uso: docker compose -f docker-compose.prod.yml -f docker-compose.prod.web.yml -f docker-compose.prod.web.ssl.yml up -d

services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./nginx/nginx.prod.ssl.web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
