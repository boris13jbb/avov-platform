# AVOV - Override prod SSL local (Fase 41)
# Uso: docker compose -f docker-compose.prod.yml -f docker-compose.prod-ssl-local.yml --env-file .env.prod-ssl-local -p avov-prod-ssl-local up -d

services:
  backend:
    env_file:
      - .env.prod-ssl-local

  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-8180}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.prod.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
